<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sipariş Yönetimi — Sahaf</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="admin-orders">
  <main>
    <div class="page-head"><h1>Sipariş Yönetimi</h1></div>
    <nav class="admin-nav">
      <a href="/admin/index.html">Panel</a>
      <a href="/admin/books.html">Kitaplar</a>
      <a href="/admin/categories.html">Kategoriler</a>
      <a href="/admin/orders.html" class="active">Siparişler</a>
      <a href="/admin/users.html">Kullanıcılar</a>
    </nav>
    <div class="filters">
      <input type="search" id="order-search" class="search" placeholder="Sipariş no, müşteri ara...">
      <select id="order-status">
        <option value="">Tüm durumlar</option>
        <option value="pending">Beklemede</option>
        <option value="processing">Hazırlanıyor</option>
        <option value="shipped">Kargolandı</option>
        <option value="completed">Tamamlandı</option>
        <option value="cancelled">İptal edildi</option>
      </select>
      <select id="order-sort">
        <option value="date_desc">En yeni</option>
        <option value="date_asc">En eski</option>
        <option value="price_desc">Tutar (azalan)</option>
        <option value="price_asc">Tutar (artan)</option>
      </select>
    </div>
    <div id="admin-orders-root"></div>
  </main>
  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
