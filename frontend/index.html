<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahaf — İkinci El & Nadir Kitaplar</title>
  <meta name="description" content="Sahaf: ikinci el, nadir ve sıfır kitapların buluşma noktası. Roman, tarih, felsefe, bilim kurgu ve daha fazlası.">
  <meta property="og:title" content="Sahaf — İkinci El & Nadir Kitaplar">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="home">
  <main>
    <section class="hero">
      <h1>Sahafın Tozlu Raflarına Hoş Geldiniz</h1>
      <p>İkinci el, nadir ve sıfır kitaplar; her bütçeye uygun fiyatlarla.</p>
    </section>

    <div class="filters">
      <input type="search" id="search" class="search" placeholder="Kitap adı veya yazar ara...">
      <select id="condition" aria-label="Durum">
        <option value="">Tüm durumlar</option>
        <option value="new">Sıfır</option>
        <option value="good">İyi</option>
        <option value="fair">Orta</option>
        <option value="poor">Yıpranmış</option>
      </select>
      <select id="sort" aria-label="Sıralama">
        <option value="newest">En yeni</option>
        <option value="oldest">En eski</option>
        <option value="price_asc">Fiyat (artan)</option>
        <option value="price_desc">Fiyat (azalan)</option>
        <option value="title_asc">Başlık (A-Z)</option>
        <option value="rating_desc">En yüksek puan</option>
      </select>
    </div>

    <div class="chips" id="category-chips"></div>
    <div class="book-grid" id="books-grid"></div>
    <div class="pagination" id="pagination"></div>
  </main>
  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
