<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>Sahaf</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="cart.html">Sepet</a>
            <a href="orders.html">Siparişlerim</a>
            <a href="login.html" id="logout-link">Çıkış Yap</a>
        </nav>
    </header>
    <main>
        <h2>Profil Bilgileri</h2>
        <div id="profile-info">
            <img id="profile-photo-display" src="" alt="Profil Fotoğrafı" style="display:none; max-width:150px; border-radius:50%; margin-bottom:10px;">
            <!-- user info will display here -->
        </div>
        <h3>Bilgileri Güncelle</h3>
        <div id="profile-error" class="error"></div>
        <label>Ad Soyad:<br>
            <input type="text" id="profile-name">
        </label><br>
        <label>Profil Fotoğrafı:<br>
            <input type="file" id="profile-photo" accept="image/*">
        </label><br>
        <button id="update-profile">Güncelle</button>
    </main>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
            document.getElementById('update-profile').addEventListener('click', updateProfile);
            document.getElementById('logout-link').addEventListener('click', logout);
        });
    </script>
</body>
</html>
