        <h2>Siparişler</h2>
        <section id="search-section">
            <input type="text" id="order-search" placeholder="Sipariş No, Kullanıcı veya Kitap Ara...">
            <select id="order-status-filter">
                <option value="all">Tüm Durumlar</option>
                <option value="pending">Onay Bekliyor</option>
                <option value="completed">Tamamlandı</option>
                <option value="cancelled">İptal Edildi</option>
            </select>
            <select id="order-sort">
                <option value="time_desc">Zaman (En Yeni)</option>
                <option value="time_asc">Zaman (En Eski)</option>
                <option value="price_desc">Fiyat (Yüksek > Düşük)</option>
                <option value="price_asc">Fiyat (Düşük > Yüksek)</option>
            </select>
            <button id="order-search-btn">Ara</button>
        </section>
        <div id="admin-orders-list"></div>
    </main>
