<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kullanıcı Yönetimi</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=23">
    <script>
        (function(){
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.body && document.body.classList.add('dark');
            }
        })();
    </script>
</head>
<body>
    <header>
        <h1 class="admin-logo">Admin Paneli</h1>
        <nav>
            <a href="../index.html" style="display:flex; align-items:center; gap:0.5rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Ana Sayfaya Dön
            </a>

            <a href="users.html" style="display:flex; align-items:center; gap:0.5rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></ci















            <select id="user-role-filter">
                <option value="">Tümü</option>
                <option value="admin">Yönetici (admin)</option>
                <option value="user">Kullanıcı (user)</option>
            </select>
            <select id="user-sort-filter">
                <option value="newest">Kayıt: En Yeni</option>
                <option value="oldest">Kayıt: En Eski</option>
            </select>
            <button id="user-search-button">Ara</button>
        </section>
        <div id="admin-users-list"></div>
    </main>
    
    <script src="../assets/js/main.js?v=25"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminUsers();
            setTimeout(() => {
                if (typeof initCustomSelects === 'function') {
                    initCustomSelects();
                }
            }, 50);
            
            const searchBtn = document.getElementById('user-search-button');
            if (searchBtn) searchBtn.addEventListener('click', loadAdminUsers);
            
            const searchInput = document.getElementById('user-search-input');
            if (searchInput) {
                searchInput.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter') loadAdminUsers();
                });
            }
            
            const roleFilter = document.getElementById('user-role-filter');
            if (roleFilter) roleFilter.addEventListener('change', loadAdminUsers);
            
            const sortFilter = document.getElementById('user-sort-filter');
            if (sortFilter) sortFilter.addEventListener('change', loadAdminUsers);
        });
    </script>
</body>
</html>
